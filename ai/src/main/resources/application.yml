server:
  port: 8090

spring:
  application:
    name: ai-service
  ai:
    vertex:
      ai:
        gemini:
          project-id: ai-project-481415
          location: us-central1
          chat:
            options:
              model: gemini-2.5-flash

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka
  instance:
    ip-address: ${AI_HOST:localhost}
    prefer-ip-address: true
