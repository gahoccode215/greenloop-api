server:
  port: 8084

spring:
  application:
    name: notification-service
  cloud:
    function:
      definition: userRegistrationConsumer;passwordResetConsumer
    stream:
      bindings:
        userRegistrationConsumer-in-0:
          destination: user-registration
          group: ${spring.application.name}
        passwordResetConsumer-in-0:
          destination: password-reset
          group: ${spring.application.name}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:crosoficelldan@gmail.com}
    password: ${MAIL_PASSWORD:azum kzcb ebsi etot}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    service-url:
      defaultZone: http://${IP_EUREKA_SERVER:localhost}:8761/eureka
  instance:
    hostname: ${IP_USER_SERVICE:localhost}
    prefer-ip-address: true

