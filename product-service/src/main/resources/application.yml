server:
  port: 8082
spring:
  application:
    name: product-service
  cloud:
    function:
      definition: orderCheckedOutProductConsumer;orderOfflineCreatedProductConsumer;orderCancelledProductConsumer
    stream:
      bindings:
        ecoPointDonation-out-0:
          destination: ecopoint-donation
        orderCheckedOutProductConsumer-in-0:
          destination: order-checked-out-product
          group: ${spring.application.name}
        orderOfflineCreatedProductConsumer-in-0:
          destination: order-offline-created-product
          group: ${spring.application.name}
        orderCancelledProductConsumer-in-0:
          destination: order-cancelled-product
          group: ${spring.application.name}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/greenloop_product_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:12345}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  cloudinary:
    cloudName: ${CLOUDINARY_NAME}
    apiKey: ${CLOUDINARY_API_KEY}
    apiSecret: ${CLOUDINARY_API_SECRET}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 1000ms
      timeout: 2000ms
      database: 1
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
rabbitmq:
  exchangeName: greenloop.exchange
  eco-donation-queue: ecoDonationQueue
  eco-donation-routing-key: ecoDonationQueueRoutingKey
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka
  instance:
    ip-address: ${PRODUCT_HOST:localhost}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    disable-swagger-default-url: true
    urls:
      - name: Gateway (Production)
        url: http://${GATEWAY_HOST:localhost}:8080/product-service/v3/api-docs
      - name: Direct (Internal)
        url: http://${PRODUCT_HOST:localhost}:${server.port}/v3/api-docs
greenloop:
  defaultImg: "https://www.innovationintextiles.com/uploads/12158/Zerocarbon-544x408-boxed.jpeg"