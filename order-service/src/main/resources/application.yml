spring:
  application:
    name: order-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/greenloop_order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:12345}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka
  instance:
    ip-address: ${ORDER_HOST:localhost}
    prefer-ip-address: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    disable-swagger-default-url: true
    urls:
      - name: Gateway
        url: http://${GATEWAY_HOST}/order-service/v3/api-docs
      - name: Direct
        url: http://${SERVICE_HOST:localhost}:${server.port}/v3/api-docs

axon:
  eventhandling:
    processors:
      order-group:
        mode: subscribing
  axonserver:
    servers: ${AXON_SERVER:localhost}:8124

ghn:
  api:
    #    base-url: https://online-gateway.ghn.vn/shiip/public-api
    dev-url: https://dev-online-gateway.ghn.vn/shiip/public-api
    token: ${GHN_API_KEY}
    shop-id: ${GHN_SHOP_ID}
    timeout: 30000
    base-url: https://dev-online-gateway.ghn.vn/shiip/public-api

