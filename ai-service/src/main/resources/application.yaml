server:
  port: 8086

spring:
  application:
    name: ai-service

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB      # Max size cho 1 file
      max-request-size: 10MB   # Max size cho cả request
      file-size-threshold: 2KB # Threshold để lưu vào disk

  ai:
    vertex:
      ai:
        gemini:
          # GCP Project Configuration
          project-id: ${GOOGLE_CLOUD_PROJECT:greenloop-482114}
          location: ${GOOGLE_CLOUD_LOCATION:us-central1}

          transport: GRPC

          chat:
            enabled: true
            options:
              model: gemini-1.5-flash-exp

              temperature: 0.8              # Độ sáng tạo (0.0-1.0), 0.8 phù hợp cho nội dung marketing
              max-output-tokens: 1000       # Số token tối đa cho response
              top-k: 40                     # Top-K sampling
              top-p: 0.95                   # Nucleus sampling


eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka
  instance:
    ip-address: ${AI_SERVICE_HOST:localhost}
    prefer-ip-address: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    disable-swagger-default-url: true
    urls:
      - name: Gateway (Production)
        url: https://${GATEWAY_HOST:api.greenloop.thanhnt-tech.id.vn}/ai-service/v3/api-docs
      - name: Gateway (Local)
        url: http://localhost:8080/ai-service/v3/api-docs
      - name: Direct (Internal)
        url: http://${SERVICE_HOST:localhost}:${server.port}/v3/api-docs

logging:
  level:
    com.greenloop.ai: DEBUG
    com.google.cloud: INFO
    org.springframework.ai: DEBUG
    org.springframework.ai.vertexai: DEBUG
